<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="Shashika Malshan - Creative Web Designer, UI/UX Specialist and Frontend Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#131129" />
    </linearGradient>

    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.45" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.28" />
    </pattern>

    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="340" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Canvas -->
    <rect x="0" y="0" width="1200" height="340" rx="20" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="1200" height="340" fill="url(#gridPattern)" />

    <!-- Ambient Glows -->
    <circle cx="190" cy="40" r="240" fill="url(#glowCyan)" />
    <circle cx="980" cy="260" r="280" fill="url(#glowViolet)" />

    <!-- Outer Border -->
    <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="url(#cardBorder)" stroke-width="1.5" />

    <!-- Availability Pill -->
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="352" height="30" rx="15" fill="#111827" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="15" r="5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="33" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.05" fill="#E2E8F0">AVAILABLE FOR WEB &amp; UI/UX PROJECTS</text>
    </g>

    <!-- Main Name -->
    <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.8" fill="#F8FAFC">Shashika Malshan</text>

    <!-- Role Headline -->
    <text x="60" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="url(#roleGrad)">Web Designer  •  UI/UX Specialist  •  Frontend Developer</text>

    <!-- Bio Taglines -->
    <text x="60" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">Crafting modern, responsive &amp; conversion-focused digital experiences from Figma to live web.</text>
    <text x="60" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">Combining creative visual design with strong BSc in ICT &amp; systems engineering foundations.</text>

    <!-- Skill Tag Pills -->
    <g transform="translate(60, 264)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">
      <rect x="0" y="0" width="146" height="32" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="16" r="4" fill="#38BDF8" />
      <text x="30" y="20.5">UI/UX &amp; Figma</text>

      <rect x="156" y="0" width="160" height="32" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="174" cy="16" r="4" fill="#818CF8" />
      <text x="186" y="20.5">Responsive Web</text>

      <rect x="326" y="0" width="150" height="32" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="344" cy="16" r="4" fill="#E879F9" />
      <text x="356" y="20.5">Brand Identity</text>

      <rect x="486" y="0" width="162" height="32" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="504" cy="16" r="4" fill="#10B981" />
      <text x="516" y="20.5">SLIIT • Sri Lanka</text>
    </g>

    <!-- Right Side: Interactive Web/UI Designer Studio Mockup -->
    <g transform="translate(760, 38)">
      <!-- Main Studio Window -->
      <rect x="0" y="0" width="384" height="264" rx="14" fill="#0F172A" fill-opacity="0.92" stroke="url(#cardBorder)" stroke-width="1.5" />

      <!-- Top Browser Bar -->
      <rect x="1" y="1" width="382" height="36" rx="13" fill="#1E293B" />
      <rect x="1" y="24" width="382" height="13" fill="#1E293B" />
      <line x1="1" y1="37" x2="383" y2="37" stroke="#334155" stroke-width="1" />

      <!-- Window Controls -->
      <circle cx="20" cy="19" r="5" fill="#EF4444" />
      <circle cx="36" cy="19" r="5" fill="#F59E0B" />
      <circle cx="52" cy="19" r="5" fill="#10B981" />

      <!-- URL Bar -->
      <rect x="76" y="9" width="232" height="20" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="192" y="22.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#94A3B8">design.shashika-m.dev</text>

      <!-- Hero UI Wireframe Block inside Studio -->
      <rect x="18" y="52" width="348" height="106" rx="10" fill="#162033" stroke="#334155" stroke-width="1" />
      <rect x="34" y="68" width="78" height="16" rx="8" fill="#06B6D4" fill-opacity="0.2" />
      <text x="73" y="79.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#38BDF8">UI SYSTEM</text>

      <rect x="34" y="94" width="186" height="12" rx="6" fill="#E2E8F0" />
      <rect x="34" y="114" width="136" height="9" rx="4.5" fill="#64748B" />
      <rect x="34" y="131" width="84" height="16" rx="6" fill="url(#accentGrad)" />

      <!-- Mini Decorative Art Frame in Hero Card -->
      <rect x="248" y="66" width="102" height="78" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="282" cy="96" r="16" fill="#6366F1" fill-opacity="0.35" />
      <circle cx="308" cy="108" r="18" fill="#06B6D4" fill-opacity="0.35" />
      <path d="M262 130 L286 106 L306 122 L322 108 L338 130 Z" fill="#818CF8" fill-opacity="0.45" />

      <!-- Bottom Bento Row -->
      <!-- Left Bento: Design Tokens / Palette -->
      <rect x="18" y="170" width="194" height="76" rx="10" fill="#162033" stroke="#334155" stroke-width="1" />
      <text x="32" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#CBD5E1">DESIGN TOKENS</text>
      <circle cx="44" cy="218" r="13" fill="#38BDF8" />
      <circle cx="78" cy="218" r="13" fill="#6366F1" />
      <circle cx="112" cy="218" r="13" fill="#A855F7" />
      <circle cx="146" cy="218" r="13" fill="#EC4899" />
      <circle cx="180" cy="218" r="13" fill="#10B981" />

      <!-- Right Bento: Clean Code / UX Score -->
      <rect x="224" y="170" width="142" height="76" rx="10" fill="#162033" stroke="#334155" stroke-width="1" />
      <text x="238" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#CBD5E1">PIXEL PERFECT</text>
      <text x="238" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#38BDF8">100%</text>
      <text x="314" y="224" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#A855F7">&lt;/&gt;</text>

      <!-- Animated Designer Cursor -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="208,122; 222,130; 208,122" dur="4s" repeatCount="indefinite" />
        <path d="M0 0 L0 18 L5 14 L9 22 L12 20 L8 12 L14 12 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2" />
        <rect x="12" y="14" width="66" height="20" rx="6" fill="#8B5CF6" />
        <text x="45" y="27.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Shashika</text>
      </g>
    </g>
  </g>
</svg>
